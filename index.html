<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Saúde</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background-color: #91BED9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    h1 {
      color: #000000;
      font-size: 28px;
      margin-bottom: 30px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.15);
    }

    /* 📦 Botões de Backup */
    .botoes-backup {
      display: flex;
      gap: 12px;
      margin-bottom: 50px;
    }

    .btn-backup {
      padding: 10px 20px;
      background: #FFFFFF;
      color: #000000;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }

    .btn-backup:hover {
      transform: scale(1.03);
    }

    .btn-backup:nth-child(1) {
      background: #E8F5E9;
      color: #2E7D32;
    }

    .btn-backup:nth-child(2) {
      background: #E3F2FD;
      color: #1565C0;
    }

    input[type="file"] {
      display: none;
    }

    /* 📊 Grade dos Ícones */
    .grade-icones {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      max-width: 900px;
    }

    .item-icone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s;
    }

    .item-icone:hover {
      transform: scale(1.05);
    }

    /* ⚫ Círculo Preto com ícone dentro */
    .circulo {
      width: 90px;
      height: 90px;
      background-color: #000000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    /* ⬇️ LETRAS ABAIXO — AGORA PRETAS */
    .rotulo {
      color: #000000; /* ← PRETO! */
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      line-height: 1.3;
    }
  </style>
</head>
<body>

<h1>Painel de Saúde</h1>

<!-- 📦 Botões de Backup -->
<div class="botoes-backup">
  <button class="btn-backup" onclick="exportarBackup()">📤 Exportar Backup</button>
  <label class="btn-backup">
    📥 Importar Backup
    <input type="file" accept=".json" onchange="importarBackup(event)">
  </label>
</div>

<!-- 📊 6 ÍCONES -->
<div class="grade-icones">

  <a href="total-geral.html" class="item-icone">
    <div class="circulo">👥</div>
    <div class="rotulo">Total Geral</div>
  </a>

  <a href="cadastros.html" class="item-icone">
    <div class="circulo">👤</div>
    <div class="rotulo">Cadastro de<br>usuários</div>
  </a>

  <a href="hipertensos.html" class="item-icone">
    <div class="circulo">❤️</div>
    <div class="rotulo">Hipertensos</div>
  </a>

  <a href="diabeticos.html" class="item-icone">
    <div class="circulo">🩸</div>
    <div class="rotulo">Diabéticos</div>
  </a>

  <a href="ambos.html" class="item-icone">
    <div class="circulo">🩸❤️</div>
    <div class="rotulo">Hipertensos e<br>Diabéticos</div>
  </a>

  <a href="acamados.html" class="item-icone">
    <div class="circulo">🛏️</div>
    <div class="rotulo">Acamados</div>
  </a>

</div>

<!-- ⚙️ FUNÇÕES DE BACKUP -->
<script>
  function exportarBackup() {
    const dados = {
      data: new Date().toLocaleString('pt-BR'),
      totalGeral: 215,
      criancas: 50,
      adultos: 142,
      idosos: 23,
      diabeticos: 0,
      hipertensos: 2,
      ambos: 0,
      acamados: 0
    };

    const arquivo = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(arquivo);
    link.download = `backup-saude-${new Date().toLocaleDateString('pt-BR').replace(/\//g, '-')}.json`;
    link.click();
    alert('✅ Backup exportado com sucesso!');
  }

  function importarBackup(event) {
    const arquivo = event.target.files[0];
    if (!arquivo) return;

    const leitor = new FileReader();
    leitor.onload = function(e) {
      try {
        const dados = JSON.parse(e.target.result);
        console.log('Dados carregados:', dados);
        alert(`✅ Backup importado!\n\nData: ${dados.data}\nTotal: ${dados.totalGeral}`);
      } catch (erro) {
        alert('❌ Arquivo inválido!');
      }
    };
    leitor.readAsText(arquivo);
  }
</script>

</body>
</html>
