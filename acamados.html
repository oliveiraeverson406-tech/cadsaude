<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acamados</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      background-color: #91BED9;
      min-height: 100vh;
      padding: 20px;
    }
    .voltar {
      display: inline-block;
      color: #000;
      text-decoration: none;
      font-weight: 700;
      margin-bottom: 15px;
    }
    h1 {
      color: #000;
      font-size: 24px;
      margin-bottom: 20px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.15);
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .pessoa-meta {
      color: #000;
      font-weight: 700;
      font-size: 13px;
      margin-top: 4px;
    }
    .tags {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .tag-diabetico { background: #FFEBEE; color: #C62828; }
    .tag-hipertenso { background: #E3F2FD; color: #1565C0; }
    .tag-acamado { background: #ECEFF1; color: #37474F; }
    .resumo {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      font-weight: 700;
      color: #000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .vazio {
      color: #000;
      text-align: center;
      padding: 20px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

<a href="index.html" class="voltar">← Voltar ao Painel</a>
<h1>🛏️ Acamados</h1>

<div class="resumo" id="resumo"></div>
<div id="lista"></div>

<script src="dados.js"></script>
<script>
  const pessoas = carregarPessoas();
  const filtradas = pessoas.filter(p => temCondicao(p, 'acamado'));

  document.getElementById('resumo').textContent = `Total: ${filtradas.length} pessoa(s)`;

  const lista = document.getElementById('lista');
  if (filtradas.length === 0) {
    lista.innerHTML = '<div class="vazio">Nenhuma pessoa encontrada nessa categoria.</div>';
  } else {
    lista.innerHTML = filtradas.map(p => {
      const idade = calcularIdade(p.nascimento);
      const tags = (p.condicoes || []).map(c => {
        const nomes = { diabetico: 'Diabético', hipertenso: 'Hipertenso', acamado: 'Acamado' };
        return `<span class="tag tag-${c}">${nomes[c] || c}</span>`;
      }).join('');
      return `
        <div class="card">
          <b>${p.nome}</b>
          <div class="pessoa-meta">${formatarData(p.nascimento)} ${idade !== null ? `(${idade} anos)` : ''} · CPF: ${p.cpf || '—'}</div>
          <div class="tags">${tags}</div>
          ${p.medicamentos && p.medicamentos.length ? `<div class="pessoa-meta" style="font-weight:500; margin-top:6px;">💊 ${p.medicamentos.join(', ')}</div>` : ''}
        </div>
      `;
    }).join('');
  }
</script>

</body>
</html>
